name: Deploy Web Game to GitHub Pages

on:
  push:
    branches:
      - build/procedural-nairobi-drive
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export Godot Web build
        run: |
          mkdir -p build/web
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            robpc/godot-headless:4.3-web \
            --headless --path /project --export-release "Web" /project/build/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
