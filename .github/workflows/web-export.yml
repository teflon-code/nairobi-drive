name: Godot Web Export

on:
  push:
    branches:
      - build/procedural-nairobi-drive
  pull_request:
    branches:
      - build/procedural-nairobi-drive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-web:
    name: Import and export Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Pull LFS assets
        run: git lfs pull

      - name: Export Web build
        run: |
          mkdir -p build/web
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            robpc/godot-headless:4.3-web \
            --headless --path /project --export-release "Web" /project/build/web/index.html

      - name: Upload Web build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nairobi-drive-web
          path: build/web/
          if-no-files-found: ignore
          retention-days: 14
